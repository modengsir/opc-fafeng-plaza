<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{overflow:hidden;font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:#12081f;color:#fff;touch-action:none;user-select:none}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;z-index:20}
.screen.on{display:flex}
#scr-start{background:radial-gradient(circle at 50% 30%,#3a1550,#12081f 70%)}
#scr-start h1{font-size:min(9vw,42px);color:#ff5f9e;text-shadow:0 0 24px rgba(255,95,158,.7);margin-bottom:8px;text-align:center}
#scr-start .sub{color:#c9a8ff;font-size:15px;margin-bottom:24px}
#scr-start .intro{color:#bbb;font-size:13px;line-height:2.1;text-align:center;margin-bottom:26px;max-width:380px}
#scr-start .intro b{color:#ffd75f}
.big-btn{background:linear-gradient(135deg,#ff5f9e,#ff8f5f);color:#fff;border:none;padding:16px 44px;border-radius:14px;font-size:18px;font-weight:800;cursor:pointer;box-shadow:0 6px 24px rgba(255,95,158,.45);letter-spacing:2px}
.big-btn:active{transform:scale(.96)}
#scr-theme{background:radial-gradient(circle at 50% 30%,#1a1040,#12081f 70%)}
#scr-theme h2{font-size:22px;margin-bottom:6px;color:#ffd75f}
#scr-theme .tip{color:#888;font-size:12px;margin-bottom:20px}
.theme-list{display:flex;flex-direction:column;gap:10px;width:min(360px,90vw)}
.theme-btn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);border-radius:14px;padding:14px 16px;font-size:15px;color:#fff;cursor:pointer;text-align:left;transition:.15s}
.theme-btn:active{background:rgba(255,95,158,.2);border-color:#ff5f9e;transform:scale(.98)}
#hud{position:fixed;top:0;left:0;width:100%;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;display:none;justify-content:space-between;align-items:flex-start;z-index:15;pointer-events:none}
#hud .left{background:rgba(10,5,25,.85);border:1px solid rgba(255,95,158,.3);border-radius:12px;padding:8px 12px;width:190px}
#hud .lbl{font-size:11px;color:#ff8a80;font-weight:700;margin-bottom:3px}
#hud .bar-bg{height:11px;background:#2a2a3a;border-radius:6px;overflow:hidden}
#hud .bar-fill{height:100%;background:linear-gradient(90deg,#ff5252,#ff8a80);border-radius:6px;transition:width .25s;width:100%}
#hud .right{background:rgba(10,5,25,.85);border:1px solid rgba(0,255,255,.25);border-radius:12px;padding:8px 12px;font-size:12px;text-align:right}
#hud .right div{margin:1px 0}
#weapon-bar{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);width:min(420px,calc(100vw - 24px));display:none;gap:8px;z-index:16}
#weapon-bar button{flex:1 1 0;min-width:0;background:rgba(10,5,25,.85);border:2px solid rgba(255,255,255,.15);border-radius:12px;color:#ccc;padding:8px 10px;font-size:13px;font-weight:700;cursor:pointer;line-height:1.5;white-space:nowrap}
#weapon-bar button span{display:block;font-size:10px;font-weight:400;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#weapon-bar button.sel{border-color:#ffd75f;color:#ffd75f;box-shadow:0 0 14px rgba(255,215,95,.35)}
#crosshair{position:fixed;left:50%;top:50%;width:34px;height:34px;transform:translate(-50%,-50%);pointer-events:none;z-index:14;display:none}
#crosshair::before,#crosshair::after{content:'';position:absolute;background:#ffd75f;box-shadow:0 0 6px #ff6d00}
#crosshair::before{left:50%;top:0;width:2px;height:100%;transform:translateX(-50%)}
#crosshair::after{top:50%;left:0;height:2px;width:100%;transform:translateY(-50%)}
#crosshair .dot{position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;background:#fff;border-radius:50%}
#combo-pop{position:fixed;top:16%;left:50%;transform:translateX(-50%);font-size:52px;font-weight:900;font-style:italic;color:#ffd75f;text-shadow:0 0 20px #ff6d00,0 3px 0 #000;display:none;z-index:16;pointer-events:none}
#combo-pop.pop{animation:cp .22s}
@keyframes cp{0%{transform:translateX(-50%) scale(1.8)}100%{transform:translateX(-50%) scale(1)}}
#toast{position:fixed;top:30%;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#ffd75f;padding:12px 24px;border-radius:12px;font-size:15px;display:none;z-index:25;pointer-events:none;white-space:nowrap}
#phase-title{position:fixed;top:38%;left:50%;transform:translate(-50%,-50%);text-align:center;z-index:18;pointer-events:none;display:none}
#phase-title .big{font-size:32px;font-weight:900;color:#ff5f9e;text-shadow:0 0 24px rgba(255,95,158,.8)}
#phase-title .small{font-size:13px;color:#c9a8ff;margin-top:8px;white-space:pre-line;line-height:1.9}
#scr-report{background:radial-gradient(circle at 50% 30%,#3a1550,#12081f 70%);overflow-y:auto;justify-content:flex-start;padding:30px 16px}
#scr-report .card{width:min(440px,92vw);background:linear-gradient(135deg,#2a1040,#160a2e);border:1px solid rgba(255,95,158,.4);border-radius:20px;padding:26px 22px}
#scr-report h2{color:#ff5f9e;font-size:21px;text-align:center}
#scr-report .stitle{color:#888;font-size:12px;text-align:center;margin:4px 0 16px}
#scr-report .line{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.07);font-size:13px}
#scr-report .line .k{color:#aaa}
#scr-report .line .v{color:#fff;font-weight:700}
#scr-report .award{text-align:center;margin:18px 0;padding:16px;background:rgba(255,215,95,.08);border-radius:14px}
#scr-report .award .t{font-size:19px;color:#ffd75f;font-weight:800}
#scr-report .eval{font-size:12px;color:#c9a8ff;line-height:1.9;text-align:center;margin-top:10px}
#scr-report .btns{display:flex;gap:10px;justify-content:center;margin-top:20px}
#scr-report .btns button{padding:12px 22px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;border:none}
#scr-report .copy{background:#ff5f9e;color:#fff}
#scr-report .again{background:transparent;color:#ff5f9e;border:1px solid #ff5f9e}
@media (max-width:640px){
  .screen{padding:16px}
  #hud{padding:calc(8px + env(safe-area-inset-top,0px)) 8px 8px}
  #hud .left{width:clamp(145px,48vw,190px);padding:7px 9px}
  #hud .right{max-width:45vw;padding:7px 9px;font-size:11px}
  #weapon-bar{bottom:calc(8px + env(safe-area-inset-bottom,0px));width:calc(100vw - 16px);gap:6px}
  #weapon-bar button{padding:8px 4px;font-size:12px}
  #weapon-bar button span{font-size:9px}
  #toast{max-width:calc(100vw - 24px);white-space:normal;text-align:center;font-size:14px}
  #combo-pop{font-size:34px}
  #phase-title .big{font-size:26px}
  #phase-title .small{font-size:12px}
}
</style>
</head>

<script>
/* ================= 音效 ================= */
var AC=window.AudioContext||window.webkitAudioContext;
var actx=null,noiseBuf=null;
function initAudio(){
  if(actx)return;
  actx=new AC();
  noiseBuf=actx.createBuffer(1,actx.sampleRate*0.4,actx.sampleRate);
  var d=noiseBuf.getChannelData(0);
  for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;
}
function tone(f,d,t,v){
  if(!actx)return;
  var o=actx.createOscillator(),g=actx.createGain();
  o.type=t||'sine';o.frequency.value=f;
  g.gain.setValueAtTime(v||.12,actx.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d);
  o.connect(g);g.connect(actx.destination);
  o.start();o.stop(actx.currentTime+d);
}
function noiseBurst(dur,freq,type,vol){
  if(!actx)return;
  var s=actx.createBufferSource();s.buffer=noiseBuf;
  var f=actx.createBiquadFilter();f.type=type||'lowpass';f.frequency.value=freq;
  var g=actx.createGain();
  g.gain.setValueAtTime(vol,actx.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+dur);
  s.connect(f);f.connect(g);g.connect(actx.destination);
  s.start();s.stop(actx.currentTime+dur);
}
function seq(fs){
  for(var i=0;i<fs.length;i++){
    (function(f,d){setTimeout(function(){tone(f,.18,'sine',.15);},d);})(fs[i],i*110);
  }
}
var sfx={
  smg:function(){noiseBurst(.05,3200,'highpass',.14);tone(880,.04,'square',.05);},
  shotgun:function(){noiseBurst(.2,750,'lowpass',.32);tone(110,.14,'sine',.28);},
  sniper:function(){noiseBurst(.12,1800,'bandpass',.24);tone(1500,.06,'sawtooth',.1);setTimeout(function(){tone(600,.15,'sine',.06);},70);},
  hit:function(){tone(200,.1,'sine',.2);noiseBurst(.06,900,'lowpass',.12);},
  pop:function(){tone(500+Math.random()*350,.08,'square',.1);},
  combo:function(n){tone(420+Math.min(n,20)*40,.1,'sine',.1);},
  good:function(){tone(523,.1);setTimeout(function(){tone(659,.1);},80);setTimeout(function(){tone(784,.15);},160);},
  bad:function(){tone(160,.3,'sawtooth',.13);},
  win:function(){seq([523,659,784,1046]);},
  ding:function(){tone(1046,.12,'sine',.1);}
};

/* ================= 文案 ================= */
var BUGS=['登录炸了','API 超时','部署失败','AI 胡写代码','样式又歪了','数据库连不上','Token 又超限','内存泄漏','接口 404','缓存不刷新','回调丢失','白屏了'];
var REQ_BAD=['能不能明天上线？','顺便做个 App 吧？','这个功能很简单吧？','预算不多但想要全套','先免费试试，后面量大','再加个小功能，很简单的','参考某 App 全部功能','要那种五颜六色的白'];
var REQ_GOOD=['登录页偶尔卡顿，能优化吗','希望支持导出 Excel','移动端字体有点小','想要一个数据看板','支付回调偶尔延迟'];
var BUBBLES=['没人买','内容没人看','竞品融资了','客户已读不回','现金流还剩 17 天','今天又没发帖','别人在晒增长','我在修登录','AI 又闯祸了','下个月房租'];
var THEMES={bug:'被 Bug 追着打',req:'客户又改需求',content:'内容没人看',money:'现金流焦虑',ai:'AI 制造新问题'};

var PLAY_Z=-8;
var AIM_SCREEN_Y=.5;
var AIM_X=0,AIM_Y=1-AIM_SCREEN_Y*2;
var GUN_Z=-.72,GUN_KICK_Z=.16;
var WALK_START_Z=PLAY_Z-7,WALK_WARN_Z=8.5,WALK_HIT_Z=12.4;

/* ================= 状态 ================= */
var R={theme:'',anxiety:100,bugs:0,badReq:0,goodSaved:0,misfire:0,bubbles:0,maxCombo:0,combo:0};
var playing=false,ended=false,weapon='smg',cd=0,timeLeft=90;
var comboTimer=null,spawnInts=[],secondInt=null;
var shake=0,firing=false;
var lastPtr={x:AIM_X,y:AIM_Y};
var clock3=null;
var bugs=[],cards=[],bubbles=[],effects=[];
var bugHits=[],cardHits=[],bubbleHits=[];
var guns={},muzzles={},flashLight,crossEl;
var scene,camera,renderer,raycaster;

/* 【修正】机位：拉远+压低视线，保证靶子在画面中央且准星对齐 */
var CAM_CONF={
  smg:{pos:[-7.5,4.8,18],look:[-7.5,1.4,PLAY_Z],fov:64},
  shotgun:{pos:[0,4.8,18],look:[0,1.4,PLAY_Z],fov:62},
  sniper:{pos:[7.5,4.8,18],look:[7.5,1.4,PLAY_Z],fov:50}
};
function viewportFit(){
  var aspect=innerWidth/innerHeight;
  return Math.max(0,Math.min(1,(aspect-1.45)/.75));
}
function fitCam(w){
  var c=CAM_CONF[w],f=viewportFit();
  return {
    pos:[c.pos[0],c.pos[1]+f*.8,c.pos[2]+f*7],
    look:[c.look[0],c.look[1],c.look[2]],
    fov:c.fov+f*(w==='sniper'?10:8)
  };
}
var targetFov=fitCam('smg').fov;
var camPos,camLookT,camPosT,curLook;

function M(c,e,i){
  return new THREE.MeshPhongMaterial({color:c,emissive:e||0,emissiveIntensity:(i==null?0.8:i)});
}
function makeText(text,fontSize,color,bg,strokeColor){
  var c=document.createElement('canvas');c.width=512;c.height=160;
  var q=c.getContext('2d');
  if(bg){q.fillStyle=bg;q.fillRect(0,20,512,120);}
  var fs=fontSize||54;
  q.font='bold '+fs+'px sans-serif';
  while(q.measureText(text).width>470&&fs>22){
    fs-=4;q.font='bold '+fs+'px sans-serif';
  }
  q.textAlign='center';q.textBaseline='middle';
  q.lineWidth=10;q.strokeStyle=strokeColor||'rgba(0,0,0,.85)';
  q.strokeText(text,256,80);
  q.fillStyle=color||'#fff';q.fillText(text,256,80);
  return new THREE.CanvasTexture(c);
}
function label3(text,x,y,z,sx,sy,color){
  var s=new THREE.Sprite(new THREE.SpriteMaterial({map:makeText(text,52,color),transparent:true,depthTest:false}));
  s.position.set(x,y,z);s.scale.set(sx||3.6,sy||1.1,1);
  scene.add(s);return s;
}
function floatText(txt,color,pos,size){
  var s=new THREE.Sprite(new THREE.SpriteMaterial({map:makeText(txt,58,color),transparent:true,depthTest:false}));
  s.position.copy(pos);s.scale.set(3.4*(size||1),1.06*(size||1),1);
  scene.add(s);
  effects.push({type:'float',obj:s,t:0,life:1.1});
}
function burst(pos,color,n){
  for(var i=0;i<n;i++){
    var m=new THREE.Mesh(new THREE.BoxGeometry(.09,.09,.09),new THREE.MeshBasicMaterial({color:color,transparent:true}));
    m.position.copy(pos);scene.add(m);
    effects.push({type:'p',obj:m,vel:new THREE.Vector3((Math.random()-.5)*6,2.5+Math.random()*4.5,(Math.random()-.5)*6),t:0,life:.6+Math.random()*.4});
  }
}
function tracer(from,to,color){
  var g=new THREE.BufferGeometry().setFromPoints([from,to]);
  var l=new THREE.Line(g,new THREE.LineBasicMaterial({color:color,transparent:true,opacity:.9}));
  scene.add(l);effects.push({type:'tracer',obj:l,t:0,life:.09});
}

function initThree(){
  clock3=new THREE.Clock();
  /* 【修正】初始相机位置与第一把武器对齐，避免开局黑屏 */
  var initCam=fitCam('smg');
  camPos=new THREE.Vector3(initCam.pos[0],initCam.pos[1],initCam.pos[2]);
  camPosT=camPos.clone();
  camLookT=new THREE.Vector3(initCam.look[0],initCam.look[1],initCam.look[2]);
  curLook=camLookT.clone();

  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x1a1030);
  scene.fog=new THREE.Fog(0x1a1030,34,70);
  camera=new THREE.PerspectiveCamera(initCam.fov,innerWidth/innerHeight,.1,140);
  camera.position.copy(camPos);
  camera.updateProjectionMatrix();
  scene.add(camera);
  renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.domElement.style.cssText='position:fixed;inset:0;z-index:1';
  document.body.appendChild(renderer.domElement);
  raycaster=new THREE.Raycaster();
  crossEl=document.getElementById('crosshair');
  crossEl.style.top=(AIM_SCREEN_Y*100)+'%';

  scene.add(new THREE.AmbientLight(0xbbaadd,1.05));
  scene.add(new THREE.HemisphereLight(0x8888ff,0x554466,.6));
  var dir=new THREE.DirectionalLight(0xaabbff,.7);
  dir.position.set(-10,22,-8);dir.castShadow=true;
  dir.shadow.mapSize.set(1024,1024);
  dir.shadow.camera.left=-22;dir.shadow.camera.right=22;
  dir.shadow.camera.top=22;dir.shadow.camera.bottom=-22;
  scene.add(dir);
  flashLight=new THREE.PointLight(0xffcc66,0,12);scene.add(flashLight);

  var sg=new THREE.BufferGeometry();
  var sp=new Float32Array(260*3);
  for(var i=0;i<260;i++){
    sp[i*3]=(Math.random()-.5)*140;
    sp[i*3+1]=16+Math.random()*34;
    sp[i*3+2]=(Math.random()-.5)*140;
  }
  sg.setAttribute('position',new THREE.BufferAttribute(sp,3));
  scene.add(new THREE.Points(sg,new THREE.PointsMaterial({color:0xffffff,size:.16,transparent:true,opacity:.85})));
  var moon=new THREE.Mesh(new THREE.SphereGeometry(2,16,16),new THREE.MeshBasicMaterial({color:0xfff6d0,fog:false}));
  moon.position.set(-28,28,-36);scene.add(moon);

  var gc=document.createElement('canvas');gc.width=gc.height=128;
  var gx=gc.getContext('2d');
  gx.fillStyle='#3a3a52';gx.fillRect(0,0,128,128);
  gx.fillStyle='#333349';gx.fillRect(0,0,64,64);gx.fillRect(64,64,64,64);
  var gt=new THREE.CanvasTexture(gc);
  gt.wrapS=gt.wrapT=THREE.RepeatWrapping;gt.repeat.set(12,12);

function makePersonTarget(text,opt){
  var g=new THREE.Group();
  var body=new THREE.Mesh(new THREE.BoxGeometry(.82,1.02,.44),M(opt.body,opt.emissive,.85));
  body.position.y=1.05;body.castShadow=true;g.add(body);
  var neck=new THREE.Mesh(new THREE.BoxGeometry(.22,.18,.2),M(0xffc49b,0x2a1208,.18));
  neck.position.y=1.62;g.add(neck);
  var head=new THREE.Mesh(new THREE.SphereGeometry(.38,18,18),M(0xffd3ad,0x2a1208,.16));
  head.position.set(0,1.9,.03);head.castShadow=true;g.add(head);
  var hair=new THREE.Mesh(new THREE.BoxGeometry(.62,.16,.42),M(opt.hair||0x30212a,0,0));
  hair.position.set(0,2.18,.02);g.add(hair);
  for(var i=0;i<2;i++){
    var eye=new THREE.Mesh(new THREE.SphereGeometry(.055,8,8),new THREE.MeshBasicMaterial({color:0x111122}));
    eye.position.set(i? .14:-.14,1.94,.36);g.add(eye);
  }
  var mouth=new THREE.Mesh(new THREE.BoxGeometry(.18,.035,.035),new THREE.MeshBasicMaterial({color:0x5c1a24}));
  mouth.position.set(0,1.76,.37);g.add(mouth);
  var armMat=M(opt.trim||opt.body,opt.emissive,.65);
  var lArm=new THREE.Mesh(new THREE.BoxGeometry(.16,.82,.16),armMat);
  var rArm=new THREE.Mesh(new THREE.BoxGeometry(.16,.82,.16),armMat.clone());
  lArm.position.set(-.55,1.03,.03);rArm.position.set(.55,1.03,.03);
  lArm.rotation.z=.18;rArm.rotation.z=-.18;g.add(lArm);g.add(rArm);
  var legMat=M(opt.leg||0x22263a,0,.25);
  var lLeg=new THREE.Mesh(new THREE.BoxGeometry(.24,.72,.2),legMat);
  var rLeg=new THREE.Mesh(new THREE.BoxGeometry(.24,.72,.2),legMat.clone());
  lLeg.position.set(-.23,.36,0);rLeg.position.set(.23,.36,0);g.add(lLeg);g.add(rLeg);
  var footMat=M(0x171722,0,.2);
  var lFoot=new THREE.Mesh(new THREE.BoxGeometry(.34,.12,.42),footMat);
  var rFoot=new THREE.Mesh(new THREE.BoxGeometry(.34,.12,.42),footMat.clone());
  lFoot.position.set(-.23,.06,.16);rFoot.position.set(.23,.06,.16);g.add(lFoot);g.add(rFoot);
  var lb=new THREE.Sprite(new THREE.SpriteMaterial({map:makeText(text,48,opt.labelColor||'#ffffff','rgba(0,0,0,.72)','rgba(0,0,0,.95)'),transparent:true,depthTest:false}));
  lb.position.y=2.75;lb.scale.set(4.35,1.36,1);g.add(lb);
  var hit=new THREE.Mesh(new THREE.BoxGeometry(1.35,2.35,1.05),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0,depthWrite:false}));
  hit.position.y=1.23;hit.userData.root=g;g.add(hit);
  g.userData={
    age:0,
    laneX:opt.x,
    speed:opt.speed,
    phase:Math.random()*6.28,
    sway:.65+Math.random()*.45,
    r:1.15,
    hitY:1.3,
    hit:hit,
    body:body,
    good:false,
    limbs:{lArm:lArm,rArm:rArm,lLeg:lLeg,rLeg:rLeg,head:head,label:lb}
  };
  return g;
}
function targetPoint(g){
  return g.position.clone().add(new THREE.Vector3(0,g.userData.hitY||1.25,0));
}
function unlinkHits(g,list){
  g.traverse(function(o){if(o.isMesh){var j=list.indexOf(o);if(j>=0)list.splice(j,1);}});
}
function walkTarget(g,dt,now){
  var u=g.userData;
  u.age+=dt;
  g.position.z+=u.speed*dt;
  var laneX=u.laneX+Math.sin(now*.9+u.phase)*u.sway;
  g.position.x+=(laneX-g.position.x)*Math.min(1,dt*2.4);
  g.position.y=Math.sin(now*6+u.phase)*.025;
  g.rotation.y=Math.sin(now*1.1+u.phase)*.08;
  var step=Math.sin(now*8+u.phase);
  if(u.limbs){
    u.limbs.lLeg.rotation.x=step*.45;
    u.limbs.rLeg.rotation.x=-step*.45;
    u.limbs.lArm.rotation.x=-step*.28;
    u.limbs.rArm.rotation.x=step*.28;
    u.limbs.head.position.y=1.9+Math.abs(step)*.035;
    u.limbs.label.position.y=2.75+Math.abs(step)*.035;
  }
  if(g.position.z>WALK_WARN_Z&&u.body&&u.body.material){
    u.body.material.emissive.setHex(0xff2222);
    u.body.material.emissiveIntensity=.35+.35*Math.sin(now*18);
  }
  return g.position.z>WALK_HIT_Z;
}

function syncAim(){
  if(crossEl){
    crossEl.style.left=((lastPtr.x+1)*50)+'%';
    crossEl.style.top=((1-lastPtr.y)*50)+'%';
  }
}
function setAimFromPointer(e){
  lastPtr.x=(e.clientX/innerWidth)*2-1;
  lastPtr.y=-(e.clientY/innerHeight)*2+1;
  syncAim();
}
function fireAtAim(){
  fire(lastPtr.x,lastPtr.y);
}

/* ================= 开火 ================= */
function muzzleWorld(){
  var v=muzzles[weapon].clone();
  guns[weapon].localToWorld(v);
  return v;
}
function fire(nx,ny){
  if(!playing||cd>0)return;
  var mw=muzzleWorld();
  flashLight.position.copy(mw);flashLight.intensity=3;
  guns[weapon].userData.kick=1;
  var ray=new THREE.Raycaster();
  ray.setFromCamera({x:nx,y:ny},camera);
  var i,h;
  if(weapon==='smg'){
    cd=.09;sfx.smg();
    var hits=ray.intersectObjects(bugHits,false);
    if(hits.length){
      h=hits[0];
      tracer(mw,h.point,0xffee88);
      smashBug(h.object.userData.root,h.point);
    }else{
      tracer(mw,ray.ray.at(40,new THREE.Vector3()),0xffee88);
    }
  }else if(weapon==='shotgun'){
    cd=.7;sfx.shotgun();shake=Math.min(1,shake+.25);
    var tg=[];
    for(i=0;i<cards.length;i++){
      if(!cards[i].userData.dead&&ray.ray.distanceToPoint(targetPoint(cards[i]))<1.75)tg.push(cards[i]);
    }
    if(tg.length){
      tracer(mw,targetPoint(tg[0]),0xffaa55);
      tracer(mw,targetPoint(tg[0]).add(new THREE.Vector3(.4,.3,0)),0xffaa55);
      for(i=0;i<tg.length;i++)shootCard(tg[i]);
    }else{
      tracer(mw,ray.ray.at(40,new THREE.Vector3()),0xffaa55);
    }
  }else{
    cd=.9;sfx.sniper();shake=Math.min(1,shake+.3);
    var tb=[];
    for(i=0;i<bubbles.length;i++){
      if(!bubbles[i].userData.dead&&ray.ray.distanceToPoint(targetPoint(bubbles[i]))<(bubbles[i].userData.r||1.15)+.35)tb.push(bubbles[i]);
    }
    if(tb.length){
      var far=tb[0];
      for(i=0;i<tb.length;i++){
        if(targetPoint(tb[i]).distanceTo(camera.position)>targetPoint(far).distanceTo(camera.position))far=tb[i];
      }
      tracer(mw,targetPoint(far),0xcc88ff);
      tb.sort(function(a,b){return a.position.distanceTo(camera.position)-b.position.distanceTo(camera.position);});
      for(i=0;i<tb.length;i++)popBubble(tb[i]);
    }else{
      tracer(mw,ray.ray.at(40,new THREE.Vector3()),0xcc88ff);
    }
  }
}
function smashBug(g,pt){
  if(g.userData.dead)return;
  g.userData.dead=true;
  var i=bugs.indexOf(g);if(i>=0)bugs.splice(i,1);
  unlinkHits(g,bugHits);
  R.bugs++;addCombo();setAnx(R.anxiety-2);sfx.hit();
  burst(pt||g.position,0x88ff88,R.combo>=5?16:9);
  floatText('焦虑 -2','#ff8a80',g.position.clone().add(new THREE.Vector3(0,1.8,0)),.85);
  if(R.combo>=5)shake=Math.min(1.2,shake+.3);
  effects.push({type:'smash',obj:g,t:0});
  checkWin();
}
function shootCard(g){
  if(g.userData.dead)return;
  g.userData.dead=true;
  var i=cards.indexOf(g);if(i>=0)cards.splice(i,1);
  unlinkHits(g,cardHits);
  R.badReq++;addCombo();setAnx(R.anxiety-4);sfx.hit();
  burst(g.position,0xffa040,14);
  floatText('离谱需求 -4','#ffd75f',g.position.clone().add(new THREE.Vector3(0,1.5,0)),.95);
  effects.push({type:'smash',obj:g,t:0});
  checkWin();
}
function popBubble(g){
  if(g.userData.dead)return;
  g.userData.dead=true;
  var i=bubbles.indexOf(g);if(i>=0)bubbles.splice(i,1);
  unlinkHits(g,bubbleHits);
  R.bubbles++;addCombo();setAnx(R.anxiety-3);sfx.pop();
  burst(g.position,0xc9a8ff,12);
  floatText('焦虑 -3','#ff8a80',g.position.clone().add(new THREE.Vector3(0,1.2,0)),.85);
  effects.push({type:'smash',obj:g,t:0});
  scene.fog.color.lerp(new THREE.Color(0x4a3a6e),.05);
  scene.background.lerp(new THREE.Color(0x4a3a6e),.05);
  checkWin();
}

/* ================= 主循环 ================= */
function animate(){
  requestAnimationFrame(animate);
  var dt=Math.min(clock3.getDelta(),.05);
  var now=Date.now()*.001;
  if(cd>0)cd-=dt;
  flashLight.intensity*=.75;

  camPos.lerp(camPosT,.06);
  curLook.lerp(camLookT,.07);
  if(Math.abs(camera.fov-targetFov)>.05){
    camera.fov+=(targetFov-camera.fov)*.08;
    camera.updateProjectionMatrix();
  }
  camera.position.set(
    camPos.x+(Math.random()-.5)*shake,
    camPos.y+(Math.random()-.5)*shake*.6,
    camPos.z+(Math.random()-.5)*shake
  );
  camera.lookAt(curLook);
  shake*=.86;
  syncAim();

  var g=guns[weapon];
  if(g){
    var k=g.userData.kick||0;
    g.userData.kick=Math.max(0,k-dt*7);
    g.position.set(.42,-.38+Math.sin(now*1.7)*.008,GUN_Z+k*GUN_KICK_Z);
    g.rotation.x=k*.16;
  }
  if(firing&&weapon==='smg'&&playing)fireAtAim();

  var i,b,c;
  if(playing){
    for(i=bugs.length-1;i>=0;i--){
      b=bugs[i];
      if(b.userData.dead)continue;
      if(walkTarget(b,dt,now)){
        b.userData.dead=true;bugs.splice(i,1);
        unlinkHits(b,bugHits);
        effects.push({type:'escape',obj:b,t:0});
        setAnx(R.anxiety+4);resetCombo();toast('😰 Bug 冲到脸上了，焦虑+4');
      }
    }
    for(i=cards.length-1;i>=0;i--){
      c=cards[i];
      if(c.userData.dead)continue;
      if(walkTarget(c,dt,now)){
        c.userData.dead=true;cards.splice(i,1);
        unlinkHits(c,cardHits);
        if(c.userData.good){
          R.goodSaved++;setAnx(R.anxiety-1);sfx.ding();
          floatText('✅ 存入白板','#a5d6a7',c.position.clone().add(new THREE.Vector3(0,1.3,0)),.9);
          burst(c.position,0x66bb6a,8);
        }else{
          setAnx(R.anxiety+5);resetCombo();sfx.bad();
          floatText('离谱需求贴脸! +5','#ff5252',c.position.clone().add(new THREE.Vector3(0,1.3,0)),.95);
          burst(c.position,0xff5252,10);
        }
        effects.push({type:'smash',obj:c,t:0});
      }
    }
    for(i=bubbles.length-1;i>=0;i--){
      b=bubbles[i];
      if(b.userData.dead)continue;
      if(walkTarget(b,dt,now)){
        b.userData.dead=true;bubbles.splice(i,1);
        unlinkHits(b,bubbleHits);
        effects.push({type:'escape',obj:b,t:0});
        setAnx(R.anxiety+4);resetCombo();toast('💭 焦虑压过来了，焦虑+4');
      }
    }
  }
  for(i=effects.length-1;i>=0;i--){
    var e=effects[i];
    e.t+=dt;
    if(e.type==='p'){
      e.vel.y-=14*dt;
      e.obj.position.addScaledVector(e.vel,dt);
      e.obj.material.opacity=1-e.t/e.life;
      if(e.t>e.life){scene.remove(e.obj);effects.splice(i,1);}
    }else if(e.type==='tracer'){
      e.obj.material.opacity=.9*(1-e.t/e.life);
      if(e.t>e.life){scene.remove(e.obj);effects.splice(i,1);}
    }else if(e.type==='float'){
      e.obj.position.y+=dt*1.2;
      e.obj.material.opacity=1-e.t/e.life;
      if(e.t>e.life){scene.remove(e.obj);effects.splice(i,1);}
    }else if(e.type==='smash'){
      e.obj.scale.multiplyScalar(.8);
      e.obj.rotation.y+=dt*10;
      if(e.t>.2){scene.remove(e.obj);effects.splice(i,1);}
    }else if(e.type==='bpop'){
      e.obj.scale.setScalar(1+e.t*6);
      e.obj.traverse(function(o){if(o.material)o.material.opacity=Math.max(0,1-e.t*4);});
      if(e.t>.28){scene.remove(e.obj);effects.splice(i,1);}
    }else if(e.type==='escape'){
      e.obj.position.y+=dt*5;
      e.obj.scale.multiplyScalar(.93);
      if(e.t>.5){scene.remove(e.obj);effects.splice(i,1);}
    }
  }
  renderer.render(scene,camera);
}

/* ================= HUD ================= */
function setAnx(v){
  R.anxiety=Math.max(0,Math.min(100,v));
  document.getElementById('anx-val').textContent=Math.round(R.anxiety);
  document.getElementById('anx-bar').style.width=R.anxiety+'%';
}
function addCombo(){
  R.combo++;
  R.maxCombo=Math.max(R.maxCombo,R.combo);
  document.getElementById('combo-val').textContent=R.combo;
  sfx.combo(R.combo);
  if(R.combo>=2){
    var c=document.getElementById('combo-pop');
    c.textContent='x'+R.combo+' COMBO!';
    c.style.display='block';
    c.classList.remove('pop');
    void c.offsetWidth;
    c.classList.add('pop');
  }
  if(R.combo===10)toast('😌 冷静下来了…');
  if(R.combo===20)toast('🔥 手感火热！公司又活一天！');
  clearTimeout(comboTimer);
  comboTimer=setTimeout(function(){
    R.combo=0;
    document.getElementById('combo-val').textContent=0;
    document.getElementById('combo-pop').style.display='none';
  },2000);
}
function resetCombo(){
  R.combo=0;
  document.getElementById('combo-val').textContent=0;
  document.getElementById('combo-pop').style.display='none';
}
function toast(m){
  var t=document.getElementById('toast');
  t.textContent=m;t.style.display='block';
  clearTimeout(t._t);
  t._t=setTimeout(function(){t.style.display='none';},1700);
}
function show(id){
  var ss=document.querySelectorAll('.screen');
  for(var i=0;i<ss.length;i++)ss[i].classList.remove('on');
  if(id)document.getElementById(id).classList.add('on');
}
function fmt(){
  return String(Math.floor(timeLeft/60)).padStart(2,'0')+':'+String(timeLeft%60).padStart(2,'0');
}

/* ================= 流程 ================= */
function toTheme(){initAudio();show('scr-theme');}
function pickTheme(t){
  R.theme=t;sfx.good();show(null);
  document.getElementById('pt-big').textContent='🔫 自由开火时间';
  document.getElementById('pt-small').textContent='三大靶位的人物会往你这边冲\n看头顶文字，按 1/2/3 或点按钮换枪\n身体发红=快贴脸了，立刻开火！';
  document.getElementById('phase-title').style.display='block';
  setTimeout(function(){
    document.getElementById('phase-title').style.display='none';
    startGame();
  },2200);
}
function startGame(){
  playing=true;ended=false;timeLeft=90;
  document.getElementById('hud').style.display='flex';
  document.getElementById('weapon-bar').style.display='flex';
  if(crossEl)crossEl.style.display='block';
  document.getElementById('timer').textContent=fmt();
  setAnx(100);
  spawnInts.push(setInterval(spawnBug,800));
  spawnInts.push(setInterval(spawnCard,2600));
  spawnInts.push(setInterval(spawnBubble,1000));
  spawnBug();spawnBug();spawnCard();spawnBubble();spawnBubble();
  secondInt=setInterval(function(){
    if(!playing)return;
    timeLeft--;
    document.getElementById('timer').textContent=fmt();
    if(timeLeft<=0)endGame();
  },1000);
}
function checkWin(){
  if(R.anxiety<=0&&!ended){
    ended=true;playing=false;
    sfx.win();toast('🎉 焦虑清零！优雅发疯成功！');
    var cols=[0xff5f9e,0x00e5ff,0xffd75f,0x66bb6a,0xc070ff];
    for(var i=0;i<5;i++){
      (function(d,col){
        setTimeout(function(){
          burst(new THREE.Vector3((Math.random()-.5)*14,2+Math.random()*3,(Math.random()-.5)*8),col,22);
        },d);
      })(i*180,cols[i]);
    }
    setTimeout(endGame,1800);
  }
}
function endGame(){
  playing=false;ended=true;
  for(var i=0;i<spawnInts.length;i++)clearInterval(spawnInts[i]);
  clearInterval(secondInt);
  document.getElementById('hud').style.display='none';
  document.getElementById('weapon-bar').style.display='none';
  if(crossEl)crossEl.style.display='none';
  var cleared=100-Math.round(R.anxiety);
  var scores=[['Bug 扫射王',R.bugs],['需求守门员',R.badReq*2],['焦虑狙击手',R.bubbles]];
  scores.sort(function(a,b){return b[1]-a[1];});
  var title=scores[0][1]>0?scores[0][0]:'今日发疯练习生';
  if(R.maxCombo>=20)title='今日发疯 MVP';
  if(cleared<20)title='破防但还在坚持的人';
  var evals={
    bug:'Bug 还没修完，但你突突 Bug 的手速，已经让 Bug 害怕了。',
    req:'你今天没有解决所有问题，但你成功阻止了需求继续长胖。',
    content:'内容没人看？至少发疯广场全程围观了你的枪法。',
    money:'钱还没到账，但情绪先回血了。活着就是胜利。',
    ai:'AI 制造的问题，被你亲手狙掉了。这是人类的一次小胜利。'
  };
  var evalTxt=evals[R.theme]||evals.bug;
  var themeName=THEMES[R.theme]||'创业破事';
  document.getElementById('report-card').innerHTML=
    '<h2>🤪 OPC 发疯广场 · 今日战报</h2>'+
    '<div class="stitle">今日破防源：'+themeName+'</div>'+
    '<div class="line"><span class="k">🔫 击退 Bug 人</span><span class="v">'+R.bugs+' 个</span></div>'+
    '<div class="line"><span class="k">💥 轰退离谱需求</span><span class="v">'+R.badReq+' 个</span></div>'+
    '<div class="line"><span class="k">🎯 狙退焦虑念头</span><span class="v">'+R.bubbles+' 个</span></div>'+
    '<div class="line"><span class="k">最高连击</span><span class="v">x'+R.maxCombo+'</span></div>'+
    '<div class="line"><span class="k">焦虑清除</span><span class="v">'+cleared+'%</span></div>'+
    '<div class="award"><div style="font-size:11px;color:#aaa;margin-bottom:4px">今日称号</div><div class="t">「'+title+'」</div></div>'+
    '<div class="eval">'+evalTxt+'</div>'+
    '<div class="btns">'+
    '<button class="copy" onclick="copyReport()">📋 复制战报</button>'+
    '<button class="again" onclick="location.reload()">🔄 再疯一次</button>'+
    '</div>';
  show('scr-report');
}
function copyReport(){
  var cleared=100-Math.round(R.anxiety);
  var themeName=THEMES[R.theme]||'创业破事';
  var txt='OPC 发疯广场今日战报\n今日破防源：'+themeName+'\n🔫 击退 Bug 人：'+R.bugs+' 个\n💥 轰退离谱需求：'+R.badReq+' 个\n🎯 狙退焦虑念头：'+R.bubbles+' 个\n焦虑清除：'+cleared+'%\n现实里不能发疯，游戏里优雅发疯。🤪';
  if(navigator.clipboard){
    navigator.clipboard.writeText(txt).then(function(){toast('📋 已复制，去晒战报！');});
  }else{
    var ta=document.createElement('textarea');
    ta.value=txt;document.body.appendChild(ta);
    ta.select();document.execCommand('copy');ta.remove();
    toast('📋 已复制！');
  }
}

/* ================= 输入 ================= */
window.addEventListener('keydown',function(e){
  if(e.key==='1')switchWeapon('smg');
  if(e.key==='2')switchWeapon('shotgun');
  if(e.key==='3')switchWeapon('sniper');
  if(e.key===' '){e.preventDefault();firing=true;fireAtAim();}
});
window.addEventListener('keyup',function(e){if(e.key===' ')firing=false;});
window.addEventListener('pointerdown',function(e){
  if(!playing)return;
  if(e.target.closest&&e.target.closest('#weapon-bar'))return;
  setAimFromPointer(e);
  firing=true;fireAtAim();
});
window.addEventListener('pointerup',function(){firing=false;});
window.addEventListener('pointermove',setAimFromPointer);
window.addEventListener('contextmenu',function(e){e.preventDefault();});

/* ================= 启动 ================= */
if(window.THREE){
  initThree();
  animate();
}else{
  var errEl=document.getElementById('three-err');
  if(errEl)errEl.style.display='block';
}
window.addEventListener('resize',function(){
  if(!renderer)return;
  var c=fitCam(weapon);
  camPosT.set(c.pos[0],c.pos[1],c.pos[2]);
  camLookT.set(c.look[0],c.look[1],c.look[2]);
  targetFov=c.fov;
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  syncAim();
});
</script>
