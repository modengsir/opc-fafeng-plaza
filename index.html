<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>OPC 发疯广场 3D · 修正版</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { overflow: hidden; font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #12081f; color: #fff; touch-action: none; user-select: none; }
    
    /* UI 层 */
    #ui-layer { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
    .hud-panel { position: absolute; background: rgba(20, 10, 30, 0.8); border: 1px solid #4a2c66; padding: 8px 15px; border-radius: 8px; backdrop-filter: blur(4px); }
    
    /* 左上角血条 */
    #hp-box { top: 20px; left: 20px; width: 200px; }
    .bar-bg { width: 100%; height: 10px; background: #333; border-radius: 5px; margin-top: 5px; overflow: hidden; }
    .bar-fill { height: 100%; background: linear-gradient(90deg, #ff4d4d, #ff9e9e); width: 100%; transition: width 0.2s; }
    
    /* 右上角信息 */
    #info-box { top: 20px; right: 20px; text-align: right; }
    
    /* 底部武器栏 */
    #weapon-bar { bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; pointer-events: auto; }
    .w-btn { 
        background: rgba(0,0,0,0.6); border: 2px solid #444; color: #aaa; 
        padding: 10px 20px; border-radius: 12px; cursor: pointer; text-align: center; transition: all 0.2s;
        min-width: 100px;
    }
    .w-btn.active { border-color: #ffcc00; color: #fff; background: rgba(255, 204, 0, 0.1); transform: translateY(-5px); box-shadow: 0 5px 15px rgba(255, 204, 0, 0.3); }
    .w-name { font-weight: bold; font-size: 16px; display: block; margin-bottom: 4px; }
    .w-desc { font-size: 12px; opacity: 0.8; }

    /* 屏幕正中提示 */
    #msg-area { position: absolute; top: 30%; left: 50%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; }
    .float-text { font-size: 24px; font-weight: bold; text-shadow: 0 2px 4px rgba(0,0,0,0.8); animation: floatUp 1s forwards; }
    @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-50px); } }

    /* 准星 */
    #crosshair { position: absolute; top: 50%; left: 50%; width: 20px; height: 20px; transform: translate(-50%, -50%); pointer-events: none; }
    #crosshair::before, #crosshair::after { content: ''; position: absolute; background: rgba(255, 255, 255, 0.8); }
    #crosshair::before { top: 9px; left: 0; width: 20px; height: 2px; }
    #crosshair::after { top: 0; left: 9px; width: 2px; height: 20px; }

    /* 开始遮罩 */
    #start-screen { position: fixed; inset: 0; background: rgba(18, 8, 31, 0.95); z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: auto; }
    .start-btn { background: linear-gradient(135deg, #ff5f9e, #ff9e9e); border: none; padding: 15px 40px; font-size: 20px; color: #fff; border-radius: 30px; cursor: pointer; margin-top: 30px; box-shadow: 0 0 20px rgba(255, 95, 158, 0.5); font-weight: bold; }
    .start-btn:active { transform: scale(0.95); }

</style>
<!-- 引入 Three.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <!-- 游戏 UI -->
    <div id="ui-layer">
        <div id="hp-box" class="hud-panel">
            <div style="font-size:14px; color:#ff9e9e">😫 焦虑值 <span id="hp-val">100</span></div>
            <div class="bar-bg"><div class="bar-fill" id="hp-bar"></div></div>
        </div>
        
        <div id="info-box" class="hud-panel">
            <div style="font-size:14px">⏱ <span id="time-val">00:00</span></div>
            <div style="font-size:14px; margin-top:4px; color:#ffcc00">🔥 连击 <span id="combo-val">0</span></div>
            <div style="font-size:12px; margin-top:4px; opacity:0.7" id="area-name">当前区域：Bug 垃圾场</div>
        </div>

        <div id="crosshair"></div>
        <div id="msg-area"></div>

        <div id="weapon-bar">
            <div class="w-btn active" onclick="switchWeapon(0)">
                <span class="w-name">🔫 冲锋枪</span>
                <span class="w-desc">1. Bug 垃圾场</span>
            </div>
            <div class="w-btn" onclick="switchWeapon(1)">
                <span class="w-name">💥 霰弹枪</span>
                <span class="w-desc">2. 需求回收站</span>
            </div>
            <div class="w-btn" onclick="switchWeapon(2)">
                <span class="w-name">🎯 狙击枪</span>
                <span class="w-desc">3. 焦虑气泡池</span>
            </div>
        </div>
    </div>

    <!-- 开始界面 -->
    <div id="start-screen">
        <h1 style="font-size: 40px; color: #ff5f9e; text-shadow: 0 0 20px rgba(255,95,158,0.6); margin-bottom: 10px;">OPC 发疯广场 3D</h1>
        <p style="color: #c9a8ff; margin-bottom: 30px;">枪械版 · 把创业破事全部突突了</p>
        <button class="start-btn" onclick="startGame()">😤 进广场开火</button>
    </div>

<script>
    // --- 游戏配置 ---
    const CONFIG = {
        cameraHeight: 1.6, // 视线高度（人眼高度）
        targetDistance: 15, // 靶子距离（拉近一点）
        colors: [0x4ade80, 0xfacc15, 0x60a5fa] // 靶子颜色
    };

    let scene, camera, renderer;
    let targets = [];
    let isPlaying = false;
    let lastTime = 0;
    let score = 0;
    let hp = 100;
    let currentWeapon = 0; // 0:冲锋, 1:霰弹, 2:狙击
    
    // 简单的音效合成器
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        const now = audioCtx.currentTime;
        if (type === 'shoot') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(currentWeapon === 2 ? 800 : 400, now);
            osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start(now);
            osc.stop(now + 0.1);
        } else if (type === 'hit') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, now);
            osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.1);
            osc.start(now);
            osc.stop(now + 0.1);
        }
    }

    function init() {
        // 1. 场景
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x12081f);
        scene.fog = new THREE.Fog(0x12081f, 10, 50); // 雾气遮挡远处

        // 2. 相机 (关键修改：位置降低，正对前方)
        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, CONFIG.cameraHeight, 0); 
        
        // 3. 渲染器
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 4. 灯光
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        // 5. 地面 (带网格)
        const gridHelper = new THREE.GridHelper(100, 50, 0x4a2c66, 0x2a1c36);
        scene.add(gridHelper);
        
        const planeGeo = new THREE.PlaneGeometry(100, 100);
        const planeMat = new THREE.MeshBasicMaterial({ color: 0x1a0f25 });
        const plane = new THREE.Mesh(planeGeo, planeMat);
        plane.rotation.x = -Math.PI / 2;
        plane.position.y = -0.01; // 略低于网格
        scene.add(plane);

        // 6. 初始生成靶子
        spawnTargets();

        // 监听窗口大小
        window.addEventListener('resize', onWindowResize, false);
        
        // 监听点击射击
        window.addEventListener('mousedown', onShoot);
        window.addEventListener('touchstart', onShoot);

        animate();
    }

    function spawnTargets() {
        // 清除旧靶子
        targets.forEach(t => scene.remove(t.mesh));
        targets = [];

        // 生成新靶子：在前方扇形区域随机分布
        for (let i = 0; i < 5; i++) {
            const geo = new THREE.BoxGeometry(1.5, 1.5, 1.5);
            const mat = new THREE.MeshLambertMaterial({ color: CONFIG.colors[i % 3] });
            const mesh = new THREE.Mesh(geo, mat);
            
            // 随机位置：X轴左右散开，Z轴向前延伸
            const x = (Math.random() - 0.5) * 20; // 左右 -10 到 10
            const z = -CONFIG.targetDistance - Math.random() * 10; // 前方 15-25米
            const y = 0.75 + Math.random() * 2; // 高度 0.75-2.75米
            
            mesh.position.set(x, y, z);
            
            // 添加简单的旋转动画数据
            mesh.userData = { rotSpeed: Math.random() * 0.02 };
            
            scene.add(mesh);
            targets.push({ mesh: mesh, active: true });
        }
    }

    function onShoot(e) {
        if (!isPlaying) return;
        // 防止点击UI触发射击
        if (e.target.closest('.w-btn') || e.target.closest('#start-screen')) return;

        playSound('shoot');

        // 模拟后坐力
        camera.rotation.x += 0.02;
        setTimeout(() => camera.rotation.x -= 0.02, 50);

        // 射线检测
        const raycaster = new THREE.Raycaster();
        // 从屏幕中心发射
        raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
        
        const intersects = raycaster.intersectObjects(targets.map(t => t.mesh));
        
        if (intersects.length > 0) {
            const hitObj = intersects[0].object;
            handleHit(hitObj);
        } else {
            // 没打中
            showMsg("描边大师？", "#aaa");
        }
    }

    function handleHit(mesh) {
        playSound('hit');
        
        // 找到对应的数据对象
        const idx = targets.findIndex(t => t.mesh === mesh);
        if (idx !== -1) {
            // 移除该靶子
            scene.remove(mesh);
            targets.splice(idx, 1);
            
            // 加分
            score += 10;
            document.getElementById('combo-val').innerText = score;
            showMsg("+10 焦虑消除", "#ffcc00");
            
            // 如果靶子太少，补充新的
            if (targets.length < 3) {
                setTimeout(spawnTargets, 500);
            }
        }
    }

    function showMsg(text, color) {
        const el = document.createElement('div');
        el.className = 'float-text';
        el.innerText = text;
        el.style.color = color;
        document.getElementById('msg-area').appendChild(el);
        setTimeout(() => el.remove(), 1000);
    }

    function switchWeapon(idx) {
        currentWeapon = idx;
        const btns = document.querySelectorAll('.w-btn');
        btns.forEach(b => b.classList.remove('active'));
        btns[idx].classList.add('active');
        
        const names = ["Bug 垃圾场", "需求回收站", "焦虑气泡池"];
        document.getElementById('area-name').innerText = "当前区域：" + names[idx];
        
        // 切换武器时重置一下视野
        spawnTargets();
    }

    function startGame() {
        document.getElementById('start-screen').style.display = 'none';
        isPlaying = true;
        init();
        
        // 计时器
        setInterval(() => {
            if(!isPlaying) return;
            const now = Date.now();
            const diff = Math.floor((now - lastTime) / 1000);
            // 这里简单显示运行时间，实际逻辑可更复杂
            // lastTime 在 init 里没设，这里简化处理
        }, 1000);
    }

    function onWindowResize() {
        if (!camera || !renderer) return;
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
        requestAnimationFrame(animate);
        if (!isPlaying)
