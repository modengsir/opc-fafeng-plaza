<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>OPC 发疯广场 3D · 枪械版</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{overflow:hidden;font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:#12081f;color:#fff;touch-action:none;user-select:none}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;z-index:20}
.screen.on{display:flex}
#scr-start{background:radial-gradient(circle at 50% 30%,#3a1550,#12081f 70%)}
#scr-start h1{font-size:min(9vw,42px);color:#ff5f9e;text-shadow:0 0 24px rgba(255,95,158,.7);margin-bottom:8px;text-align:center}
#scr-start .sub{color:#c9a8ff;font-size:15px;margin-bottom:24px}
#scr-start .intro{color:#bbb;font-size:13px;line-height:2.1;text-align:center;margin-bottom:26px;max-width:380px}
#scr-start .intro b{color:#ffd75f}
.big-btn{background:linear-gradient(135deg,#ff5f9e,#ff8f5f);color:#fff;border:none;padding:16px 44px;border-radius:14px;font-size:18px;font-weight:800;cursor:pointer;box-shadow:0 6px 24px rgba(255,95,158,.45);letter-spacing:2px}
.big-btn:active{transform:scale(.96)}
#scr-theme{background:radial-gradient(circle at 50% 30%,#1a1040,#12081f 70%)}
#scr-theme h2{font-size:22px;margin-bottom:6px;color:#ffd75f}
#scr-theme .tip{color:#888;font-size:12px;margin-bottom:20px}
.theme-list{display:flex;flex-direction:column;gap:10px;width:min(360px,90vw)}
.theme-btn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);border-radius:14px;padding:14px 16px;font-size:15px;color:#fff;cursor:pointer;text-align:left;transition:.15s}
.theme-btn:active{background:rgba(255,95,158,.2);border-color:#ff5f9e;transform:scale(.98)}
#hud{position:fixed;top:0;left:0;width:100%;padding:10px 14px;display:none;justify-content:space-between;align-items:flex-start;z-index:15;pointer-events:none}
#hud .left{background:rgba(10,5,25,.85);border:1px solid rgba(255,95,158,.3);border-radius:12px;padding:8px 12px;width:190px}
#hud .lbl{font-size:11px;color:#ff8a80;font-weight:700;margin-bottom:3px}
#hud .bar-bg{height:11px;background:#2a2a3a;border-radius:6px;overflow:hidden}
#hud .bar-fill{height:100%;background:linear-gradient(90deg,#ff5252,#ff8a80);border-radius:6px;transition:width .25s;width:100%}
#hud .right{background:rgba(10,5,25,.85);border:1px solid rgba(0,255,255,.25);border-radius:12px;padding:8px 12px;font-size:12px;text-align:right}
#hud .right div{margin:1px 0}
#weapon-bar{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);display:none;gap:8px;z-index:16}
#weapon-bar button{background:rgba(10,5,25,.85);border:2px solid rgba(255,255,255,.15);border-radius:12px;color:#ccc;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;line-height:1.5}
#weapon-bar button span{display:block;font-size:10px;font-weight:400;color:#888}
#weapon-bar button.sel{border-color:#ffd75f;color:#ffd75f;box-shadow:0 0 14px rgba(255,215,95,.35)}
#crosshair{position:fixed;width:34px;height:34px;margin:-17px 0 0 -17px;pointer-events:none;z-index:14;display:none}
#crosshair::before,#crosshair::after{content:'';position:absolute;background:#ffd75f;box-shadow:0 0 6px #ff6d00}
#crosshair::before{left:50%;top:0;width:2px;height:100%;transform:translateX(-50%)}
#crosshair::after{top:50%;left:0;height:2px;width:100%;transform:translateY(-50%)}
#crosshair .dot{position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;background:#fff;border-radius:50%}
#combo-pop{position:fixed;top:16%;left:50%;transform:translateX(-50%);font-size:52px;font-weight:900;font-style:italic;color:#ffd75f;text-shadow:0 0 20px #ff6d00,0 3px 0 #000;display:none;z-index:16;pointer-events:none}
#combo-pop.pop{animation:cp .22s}
@keyframes cp{0%{transform:translateX(-50%) scale(1.8)}100%{transform:translateX(-50%) scale(1)}}
#toast{position:fixed;top:30%;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#ffd75f;padding:12px 24px;border-radius:12px;font-size:15px;display:none;z-index:25;pointer-events:none;white-space:nowrap}
#phase-title{position:fixed;top:38%;left:50%;transform:translate(-50%,-50%);text-align:center;z-index:18;pointer-events:none;display:none}
#phase-title .big{font-size:32px;font-weight:900;color:#ff5f9e;text-shadow:0 0 24px rgba(255,95,158,.8)}
#phase-title .small{font-size:13px;color:#c9a8ff;margin-top:8px;white-space:pre-line;line-height:1.9}
#scr-report{background:radial-gradient(circle at 50% 30%,#3a1550,#12081f 70%);overflow-y:auto;justify-content:flex-start;padding:30px 16px}
#scr-report .card{width:min(440px,92vw);background:linear-gradient(135deg,#2a1040,#160a2e);border:1px solid rgba(255,95,158,.4);border-radius:20px;padding:26px 22px}
#scr-report h2{color:#ff5f9e;font-size:21px;text-align:center}
#scr-report .stitle{color:#888;font-size:12px;text-align:center;margin:4px 0 16px}
#scr-report .line{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.07);font-size:13px}
#scr-report .line .k{color:#aaa}
#scr-report .line .v{color:#fff;font-weight:700}
#scr-report .award{text-align:center;margin:18px 0;padding:16px;background:rgba(255,215,95,.08);border-radius:14px}
#scr-report .award .t{font-size:19px;color:#ffd75f;font-weight:800}
#scr-report .eval{font-size:12px;color:#c9a8ff;line-height:1.9;text-align:center;margin-top:10px}
#scr-report .btns{display:flex;gap:10px;justify-content:center;margin-top:20px}
#scr-report .btns button{padding:12px 22px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;border:none}
#scr-report .copy{background:#ff5f9e;color:#fff}
#scr-report .again{background:transparent;color:#ff5f9e;border:1px solid #ff5f9e}
</style>
</head>
<body>

<div id="scr-start" class="screen on">
  <h1>🤪 OPC 发疯广场 3D</h1>
  <div class="sub">枪械版 · 把创业破事全部突突了</div>
  <div class="intro">
    全景视角，三大区域靶子一览无余：<br>
    <b>🔫 冲锋枪</b> → 扫射 Bug 垃圾场（长按连发）<br>
    <b>💥 霰弹枪</b> → 轰掉离谱需求卡（别误伤合理需求！）<br>
    <b>🎯 狙击枪</b> → 穿透狙击焦虑气泡（一枪串一串）<br><br>
    ⚠️ 靶子逃跑前会<b>红闪警告</b>，别让它跑了！<br>
    90 秒内把焦虑打到 0，领「今日发疯战报」

  <button class="big-btn" onclick="toTheme()">😤 进广场开火</button>
  <div id="three-err" style="display:none;margin-top:16px;color:#ff5252;font-size:13px;line-height:1.9;text-align:center">⚠️ 3D 引擎（Three.js）加载失败<br>请检查网络后刷新；或把 three.min.js 上传到仓库实现离线运行</div>
</div>

<div id="scr-theme" class="screen">
  <h2>今天谁又把你整破防了？</h2>
  <div class="tip">选一个今日破防主题（影响战报）</div>
  <div class="theme-list">
    <button class="theme-btn" onclick="pickTheme('bug')">🐛 今天被 Bug 追着打</button>
    <button class="theme-btn" onclick="pickTheme('req')">📦 今天客户又改需求</button>
    <button class="theme-btn" onclick="pickTheme('content')">📢 今天内容没人看</button>
    <button class="theme-btn" onclick="pickTheme('money')">💸 今天现金流让我安静</button>
    <button class="theme-btn" onclick="pickTheme('ai')">🤖 今天 AI 帮我制造了新问题</button>
  </div>
</div>

<div id="hud">
  <div class="left">
    <div class="lbl">😤 焦虑 <span id="anx-val">100</span></div>
    <div class="bar-bg"><div class="bar-fill" id="anx-bar"></div></div>
  </div>
  <div class="right">
    <div>⏱ <span id="timer">01:30</span></div>
    <div>🔥 连击 <span id="combo-val">0</span></div>
    <div>📍 <span id="zone-name">Bug 垃圾场</span></div>
  </div>
</div>

<div id="weapon-bar">
  <button id="wb-smg" class="sel" onclick="switchWeapon('smg')">🔫 冲锋枪<span>1 · Bug垃圾场</span></button>
  <button id="wb-shotgun" onclick="switchWeapon('shotgun')">💥 霰弹枪<span>2 · 需求回收站</span></button>
  <button id="wb-sniper" onclick="switchWeapon('sniper')">🎯 狙击枪<span>3 · 焦虑气泡池</span></button>
</div>

<div id="crosshair"><div class="dot"></div></div>
<div id="combo-pop"></div>
<div id="toast"></div>
<div id="phase-title"><div class="big" id="pt-big"></div><div class="small" id="pt-small"></div></div>

<div id="scr-report" class="screen">
  <div class="card" id="report-card"></div>
</div>

<!-- ===== 3D 引擎四保险加载：本地 → cdnjs → unpkg → jsdelivr ===== -->
<script src="three.min.js"></script>
<script>window.THREE||document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.157.0/three.min.js"><\/script>')</script>
<script>window.THREE||document.write('<script src="https://unpkg.com/three@0.157.0/build/three.min.js"><\/script>')</script>
<script>window.THREE||document.write('<script src="https://cdn.jsdelivr.net/npm/three@0.157.0/build/three.min.js"><\/script>')</script>

<script>
/* ================= 音效 ================= */
const AC=window.AudioContext||window.webkitAudioContext;let actx,noiseBuf;
function initAudio(){if(actx)return;actx=new AC();
  noiseBuf=actx.createBuffer(1,actx.sampleRate*0.4,actx.sampleRate);
  const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
function tone(f,d,t,v){if(!actx)return;const o=actx.createOscillator(),g=actx.createGain();o.type=t||'sine';o.frequency.value=f;g.gain.setValueAtTime(v||.12,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d);o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+d);}
function noiseBurst(dur,freq,type,vol){if(!actx)return;const s=actx.createBufferSource();s.buffer=noiseBuf;const f=actx.createBiquadFilter();f.type=type||'lowpass';f.frequency.value=freq;const g=actx.createGain();g.gain.setValueAtTime(vol,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+dur);s.connect(f);f.connect(g);g.connect(actx.destination);s.start();s.stop(actx.currentTime+dur);}
const sfx={
  smg(){noiseBurst(.05,3200,'highpass',.14);tone(880,.04,'square',.05);},
  shotgun(){noiseBurst(.2,750,'lowpass',.32);tone(110,.14,'sine',.28);},
  sniper(){noiseBurst(.12,1800,'bandpass',.24);tone(1500,.06,'sawtooth',.1);setTimeout(()=>tone(600,.15,'sine',.06),70);},
  hit(){tone(200,.1,'sine',.2);noiseBurst(.06,900,'lowpass',.12);},
  pop(){tone(500+Math.random()*350,.08,'square',.1);},
  combo(n){tone(420+Math.min(n,20)*40,.1,'sine',.1);},
  good(){tone(523,.1);setTimeout(()=>tone(659,.1),80);setTimeout(()=>tone(784,.15),160);},
  bad(){tone(160,.3,'sawtooth',.13);},
  win(){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.18,'sine',.15),i*110));},
  ding(){tone(1046,.12,'sine',.1);}
};

/* ================= 文案 ================= */
const BUGS=['登录炸了','API 超时','部署失败','AI 胡写代码','样式又歪了','数据库连不上','Token 又超限','内存泄漏','接口 404','缓存不刷新','回调丢失','白屏了'];
const REQ_BAD=['能不能明天上线？','顺便做个 App 吧？','这个功能很简单吧？','预算不多但想要全套','先免费试试，后面量大','再加个小功能，很简单的','参考某 App 全部功能','要那种五颜六色的白'];
const REQ_GOOD=['登录页偶尔卡顿，能优化吗','希望支持导出 Excel','移动端字体有点小','想要一个数据看板','支付回调偶尔延迟'];
const BUBBLES=['没人买','内容没人看','竞品融资了','客户已读不回','现金流还剩 17 天','今天又没发帖','别人在晒增长','我在修登录','AI 又闯祸了','下个月房租'];
const THEMES={bug:'被 Bug 追着打',req:'客户又改需求',content:'内容没人看',money:'现金流焦虑',ai:'AI 制造新问题'};

/* ================= 状态 ================= */
const R={theme:'',anxiety:100,bugs:0,badReq:0,goodSaved:0,misfire:0,bubbles:0,maxCombo:0,combo:0};
let playing=false,ended=false,weapon='smg',cd=0,timeLeft=90;
let comboTimer=null,spawnInts=[],secondInt=null;
let shake=0,firing=false;
const lastPtr={x:0,y:-0.1};
let clock3=null;
const bugs=[],cards=[],bubbles=[],effects=[];
const bugHits=[],cardHits=[],bubbleHits=[];
let guns={},muzzles={},flashLight,crossEl;
const CAM_CONF={
  smg:{pos:[-3.5,7,15],look:[-3.5,1.8,-2],fov:58},
  shotgun:{pos:[0,6.8,15.5],look:[0,2.4,-3],fov:55},
  sniper:{pos:[3.5,7,15],look:[3.5,2.6,-2],fov:42}
};
let targetFov=58;
let camPos,camLook,camPosT,camLookT,curLook;

function M(c,e,i){return new THREE.MeshPhongMaterial({color:c,emissive:e||0,emissiveIntensity:i==null?.8:i});}
function makeText(text,fontSize,color,bg,strokeColor){
  const c=document.createElement('canvas');c.width=512;c.height=160;const q=c.getContext('2d');
  if(bg){q.fillStyle=bg;q.fillRect(0,20,512,120);}
  let fs=fontSize||54;
  q.font=`bold ${fs}px sans-serif`;
  while(q.measureText(text).width>470&&fs>22){fs-=4;q.font=`bold ${fs}px sans-serif`;}
  q.textAlign='center';q.textBaseline='middle';
  q.lineWidth=10;q.strokeStyle=strokeColor||'rgba(0,0,0,.85)';q.strokeText(text,256,80);
  q.fillStyle=color||'#fff';q.fillText(text,256,80);
  return new THREE.CanvasTexture(c);
}
function label3(text,x,y,z,sx,sy,color){
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:makeText(text,52,color),transparent:true,depthTest:false}));
  s.position.set(x,y,z);s.scale.set(sx||3.6,sy||1.1,1);scene.add(s);return s;
}
function floatText(txt,color,pos,size){
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:makeText(txt,58,color),transparent:true,depthTest:false}));
  s.position.copy(pos);s.scale.set(3.4*(size||1),1.06*(size||1),1);scene.add(s);
  effects.push({type:'float',obj:s,t:0,life:1.1});
}
function burst(pos,color,n){
  for(let i=0;i<n;i++){
    const m=new THREE.Mesh(new THREE.BoxGeometry(.09,.09,.09),new THREE.MeshBasicMaterial({color,transparent:true}));
    m.position.copy(pos);scene.add(m);
    effects.push({type:'p',obj:m,vel:new THREE.Vector3((Math.random()-.5)*6,2.5+Math.random()*4.5,(Math.random()-.5)*6),t:0,life:.6+Math.random()*.4});
  }
}
function tracer(from,to,color){
  const g=new THREE.BufferGeometry().setFromPoints([from,to]);
  const l=new THREE.Line(g,new THREE.LineBasicMaterial({color,transparent:true,opacity:.9}));
  scene.add(l);effects.push({type:'tracer',obj:l,t:0,life:.09});
}

function initThree(){
  clock3=new THREE.Clock();
  camPos=new THREE.Vector3(0,7,16);camLook=new THREE.Vector3(0,2,-2);
  camPosT=new THREE.Vector3().fromArray(CAM_CONF.smg.pos);
  camLookT=new THREE.Vector3().fromArray(CAM_CONF.smg.look);
  curLook=new THREE.Vector3(0,2,-2);

  scene=new THREE.Scene();scene.background=new THREE.Color(0x1a1030);
  scene.fog=new THREE.Fog(0x1a1030,34,70);
  camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,140);
  camera.position.copy(camPos);scene.add(camera);
  renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.domElement.style.cssText='position:fixed;inset:0;z-index:1';
  document.body.appendChild(renderer.domElement);
  raycaster=new THREE.Raycaster();
  crossEl=document.getElementById('crosshair');

  scene.add(new THREE.AmbientLight(0xbbaadd,1.05));
  scene.add(new THREE.HemisphereLight(0x8888ff,0x554466,.6));
  const dir=new THREE.DirectionalLight(0xaabbff,.7);dir.position.set(-10,22,-8);dir.castShadow=true;
  dir.shadow.mapSize.set(1024,1024);
  dir.shadow.camera.left=-22;dir.shadow.camera.right=22;dir.shadow.camera.top=22;dir.shadow.camera.bottom=-22;
  scene.add(dir);
  flashLight=new THREE.PointLight(0xffcc66,0,12);scene.add(flashLight);

  const sg=new THREE.BufferGeometry();const sp=new Float32Array(260*3);
  for(let i=0;i<260;i++){sp[i*3]=(Math.random()-.5)*140;sp[i*3+1]=16+Math.random()*34;sp[i*3+2]=(Math.random()-.5)*140;}
  sg.setAttribute('position',new THREE.BufferAttribute(sp,3));
  scene.add(new THREE.Points(sg,new THREE.PointsMaterial({color:0xffffff,size:.16,transparent:true,opacity:.85})));
  const moon=new THREE.Mesh(new THREE.SphereGeometry(2,16,16),new THREE.MeshBasicMaterial({color:0xfff6d0,fog:false}));
  moon.position.set(-28,28,-36);scene.add(moon);

  const gc=document.createElement('canvas');gc.width=gc.height=128;const gx=gc.getContext('2d');
  gx.fillStyle='#3a3a52';gx.fillRect(0,0,128,128);gx.fillStyle='#333349';gx.fillRect(0,0,64,64);gx.fillRect(64,64,64,64);
  const gt=new THREE.CanvasTexture(gc);gt.wrapS=gt.wrapT=THREE.RepeatWrapping;gt.repeat.set(12,12);
  const ground=new THREE.Mesh(new THREE.PlaneGeometry(40,40),new THREE.MeshLambertMaterial({map:gt}));
  ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);

  const fm=M(0x2a1a50,0x402090);
  [[0,-17,34,.4],[0,17,34,.4],[-17,0,.4,34],[17,0,.4,34]].forEach(([x,z,w,d])=>{
    const f=new THREE.Mesh(new THREE.BoxGeometry(w,.5,d),fm);f.position.set(x,.25,z);scene.add(f);
  });

  buildZones();buildGuns();
}

/* ================= 三大区域 ================= */
function buildZones(){
  const zoneData=[
    {x:-9,color:0x66bb6a,label:'🐛 Bug垃圾场',sub:'🔫 冲锋枪'},
    {x:0,color:0xffa040,label:'📦 需求回收站',sub:'💥 霰弹枪'},
    {x:9,color:0xc070ff,label:'💭 焦虑气泡池',sub:'🎯 狙击枪'}
  ];
  zoneData.forEach(z=>{
    const pad=new THREE.Mesh(new THREE.CircleGeometry(4.6,28),new THREE.MeshBasicMaterial({color:z.color,transparent:true,opacity:.2}));
    pad.rotation.x=-Math.PI/2;pad.position.set(z.x,.03,-2);scene.add(pad);
    const l=new THREE.PointLight(z.color,1,15);l.position.set(z.x,4,-2);scene.add(l);
    label3(z.label,z.x,7.2,-2,3.4,1.05,'#ffffff');
    label3(z.sub,z.x,6.4,-2,2.6,.8,'#ffd75f');
  });
  for(let i=0;i<6;i++){
    const b=new THREE.Mesh(new THREE.BoxGeometry(.6+Math.random()*.5,.4+Math.random()*.4,.6+Math.random()*.5),M(0x5a5a70));
    b.position.set(-9+(Math.random()-.5)*6,.25,-5.5+Math.random()*1.5);b.rotation.y=Math.random();b.castShadow=true;scene.add(b);
  }
  const board=new THREE.Group();
  const bf=new THREE.Mesh(new THREE.BoxGeometry(2.8,2,.1),M(0x8d6e63));bf.position.y=2;board.add(bf);
  const bface=new THREE.Mesh(new THREE.BoxGeometry(2.5,1.7,.11),M(0xf5f5f5,0xdddddd,.4));bface.position.set(0,2,.02);board.add(bface);
  [-1.2,1.2].forEach(x=>{const leg=new THREE.Mesh(new THREE.CylinderGeometry(.05,.05,2,6),M(0x777777));leg.position.set(x,1,0);board.add(leg);});
  board.position.set(-3.9,0,-3);board.rotation.y=Math.PI/2;scene.add(board);
  label3('📋 白板',-3.9,3.5,-3,2.2,.7,'#a5d6a7');
  const portal=new THREE.Mesh(new THREE.TorusGeometry(1.1,.1,8,20),M(0xffa040,0xff8000));
  portal.position.set(4.2,2.6,-3);scene.add(portal);

/* ================= 开火 ================= */
function muzzleWorld(){
  const v=muzzles[weapon].clone();
  guns[weapon].localToWorld(v);
  return v;
}
function fire(nx,ny){
  if(!playing||cd>0)return;
  const mw=muzzleWorld();
  flashLight.position.copy(mw);flashLight.intensity=3;
  guns[weapon].userData.kick=1;
  const ray=new THREE.Raycaster();
  ray.setFromCamera({x:nx,y:ny},camera);
  if(weapon==='smg'){
    cd=.09;sfx.smg();
    const hits=ray.intersectObjects(bugHits,false);
    if(hits.length){
      const h=hits[0];tracer(mw,h.point,0xffee88);
      smashBug(h.object.userData.root,h.point);
    }else tracer(mw,ray.ray.at(40,new THREE.Vector3()),0xffee88);
  }
  else if(weapon==='shotgun'){
    cd=.7;sfx.shotgun();shake=Math.min(1,shake+.25);
    const targets=[];
    cards.forEach(c=>{if(!c.userData.dead&&ray.ray.distanceToPoint(c.position)<2.1)targets.push(c);});
    if(targets.length){
      tracer(mw,targets[0].position.clone(),0xffaa55);
      tracer(mw,targets[0].position.clone().add(new THREE.Vector3(.4,.3,0)),0xffaa55);
      targets.forEach(c=>shootCard(c));
    }else tracer(mw,ray.ray.at(40,new THREE.Vector3()),0xffaa55);
  }
  else{
    cd=.9;sfx.sniper();shake=Math.min(1,shake+.3);
    const targets=[];
    bubbles.forEach(b=>{if(!b.userData.dead&&ray.ray.distanceToPoint(b.position)<b.userData.r+.3)targets.push(b);});
    if(targets.length){
      let far=targets[0].position.clone();
      targets.forEach(b=>{if(b.position.distanceTo(camera.position)>far.distanceTo(camera.position))far=b.position.clone();});
      tracer(mw,far,0xcc88ff);
      targets.sort((a,b)=>a.position.distanceTo(camera.position)-b.position.distanceTo(camera.position));
      targets.forEach(b=>popBubble(b));
    }else tracer(mw,ray.ray.at(40,new THREE.Vector3()),0xcc88ff);
  }
}
function smashBug(g,pt){
  if(g.userData.dead)return;g.userData.dead=true;
  const i=bugs.indexOf(g);if(i>=0)bugs.splice(i,1);
  g.traverse(o=>{if(o.isMesh){const j=bugHits.indexOf(o);if(j>=0)bugHits.splice(j,1);}});
  R.bugs++;addCombo();setAnx(R.anxiety-2);sfx.hit();
  burst(pt||g.position,0x88ff88,R.combo>=5?16:9);
  floatText('焦虑 -2','#ff8a80',g.position.clone().add(new THREE.Vector3(0,1.8,0)),.85);
  if(R.combo>=5)shake=Math.min(1.2,shake+.3);
  effects.push({type:'smash',obj:g,t:0});
  checkWin();
}
function shootCard(g){
  if(g.userData.dead)return;g.userData.dead=true;
  const i=cards.indexOf(g);if(i>=0)cards.splice(i,1);
  g.traverse(o=>{if(o.isMesh){const j=cardHits.indexOf(o);if(j>=0)cardHits.splice(j,1);}});
  if(g.userData.good){
    R.misfire++;setAnx(R.anxiety+6);resetCombo();sfx.bad();shake=Math.min(1.2,shake+.5);
    burst(g.position,0xff5252,14);
    floatText('误伤合理需求! +6','#ff5252',g.position.clone().add(new THREE.Vector3(0,1.5,0)),.95);
    toast('😱 这是合理需求啊！焦虑+6');
  }else{
    R.badReq++;addCombo();setAnx(R.anxiety-4);sfx.hit();
    burst(g.position,0xffa040,14);
    floatText('🎁 需求边界卡','#ffd75f',g.position.clone().add(new THREE.Vector3(0,1.5,0)),.95);
  }
  effects.push({type:'smash',obj:g,t:0});
  checkWin();
}
function popBubble(g){
  if(g.userData.dead)return;g.userData.dead=true;
  const i=bubbles.indexOf(g);if(i>=0)bubbles.splice(i,1);
  g.traverse(o=>{if(o.isMesh){const j=bubbleHits.indexOf(o);if(j>=0)bubbleHits.splice(j,1);}});
  R.bubbles++;addCombo();setAnx(R.anxiety-3);sfx.pop();
  burst(g.position,0xc9a8ff,12);
  floatText('焦虑 -3','#ff8a80',g.position.clone().add(new THREE.Vector3(0,1.2,0)),.85);
  effects.push({type:'bpop',obj:g,t:0});
  scene.fog.color.lerp(new THREE.Color(0x4a3a6e),.05);
  scene.background.lerp(new THREE.Color(0x4a3a6e),.05);
  checkWin();
}

/* ================= 主循环 ================= */
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock3.getDelta(),.05);
  const now=Date.now()*.001;
  if(cd>0)cd-=dt;
  flashLight.intensity*=.75;

  camPos.lerp(camPosT,.06);curLook.lerp(camLookT,.07);
  if(Math.abs(camera.fov-targetFov)>.05){camera.fov+=(targetFov-camera.fov)*.08;camera.updateProjectionMatrix();}
  camera.position.set(camPos.x+(Math.random()-.5)*shake,camPos.y+(Math.random()-.5)*shake*.6,camPos.z+(Math.random()-.5)*shake);
  camera.lookAt(curLook);
  shake*=.86;

  const g=guns[weapon];
  if(g){
    const k=g.userData.kick||0;
    g.userData.kick=Math.max(0,k-dt*7);
    g.position.set(.42,-.38+Math.sin(now*1.7)*.008,-.9+k*.22);
    g.rotation.x=k*.16;
  }
  if(firing&&weapon==='smg'&&playing)fire(lastPtr.x,lastPtr.y);

  if(playing){
    for(let i=bugs.length-1;i>=0;i--){
      const b=bugs[i];if(b.userData.dead)continue;
      b.userData.age+=dt;
      const a=b.userData.age;
      if(a<.25)b.position.y=-1.6+2.2*(a/.25);
      else b.position.y=.7+Math.sin(now*3+i)*.06;
      b.rotation.y+=dt*b.userData.spin;
      const body=b.children[0];
      if(a>2.5){body.material.emissive.setHex(0xff2222);body.material.emissiveIntensity=.5+.5*Math.sin(now*18);}
      if(a>3.5){
        b.userData.dead=true;bugs.splice(i,1);
        b.traverse(o=>{if(o.isMesh){const j=bugHits.indexOf(o);if(j>=0)bugHits.splice(j,1);}});
        effects.push({type:'escape',obj:b,t:0});
        setAnx(R.anxiety+3);resetCombo();toast('😰 Bug 跑了，焦虑+3');
      }
    }
    for(let i=cards.length-1;i>=0;i--){
      const c=cards[i];if(c.userData.dead)continue;
      c.position.x-=c.userData.speed*dt;
      c.position.y+=Math.sin(now*2+c.userData.phase)*.003;
      c.rotation.z=Math.sin(now*1.5+c.userData.phase)*.05;
      const card=c.children[0];
      if(c.position.x<-1.6){card.material.emissive.setHex(0xff2222);card.material.emissiveIntensity=.4+.4*Math.sin(now*18);}
      if(c.position.x<-3.6){
        c.userData.dead=true;cards.splice(i,1);
        c.traverse(o=>{if(o.isMesh){const j=cardHits.indexOf(o);if(j>=0)cardHits.splice(j,1);}});
        if(c.userData.good){
          R.goodSaved++;setAnx(R.anxiety-1);sfx.ding();
          floatText('✅ 存入白板','#a5d6a7',c.position.clone().add(new THREE.Vector3(0,1.3,0)),.9);
          burst(c.position,0x66bb6a,8);
        }else{
          setAnx(R.anxiety+4);resetCombo();sfx.bad();
          floatText('离谱需求混进白板! +4','#ff5252',c.position.clone().add(new THREE.Vector3(0,1.3,0)),.95);
          burst(c.position,0xff5252,10);
        }
        effects.push({type:'smash',obj:c,t:0});
      }
    }
    for(let i=bubbles.length-1;i>=0;i--){
      const b=bubbles[i];if(b.userData.dead)continue;
      b.position.y+=.4*dt;
      b.position.x+=Math.sin(now+b.userData.phase)*.004;
      const bb=b.children[0];
      if(b.position.y>5.6){bb.material.emissive.setHex(0xff2222);bb.material.emissiveIntensity=.5+.5*Math.sin(now*18);}
      if(b.position.y>7){
        b.userData.dead=true;bubbles.splice(i,1);
        b.traverse(o=>{if(o.isMesh){const j=bubbleHits.indexOf(o);if(j>=0)bubbleHits.splice(j,1);}});
        effects.push({type:'escape',obj:b,t:0});
        setAnx(R.anxiety+3);resetCombo();toast('💭 焦虑飘走了，焦虑+3');
      }
    }
  }
  for(let i=effects.length-1;i>=0;i--){
    const e=effects[i];e.t+=dt;
    if(e.type==='p'){
      e.vel.y-=14*dt;e.obj.position.addScaledVector(e.vel,dt);
      e.obj.material.opacity=1-e.t/e.life;
      if(e.t>e.life){scene.remove(e.obj);effects.splice(i,1);}
    }else if(e.type==='tracer'){
      e.obj.material.opacity=.9*(1-e.t/e.life);
      if(e.t>e.life){scene.remove(e.obj);effects.splice(i,1);}
    }else if(e.type==='float'){
      e.obj.position.y+=dt*1.2;e.obj.material.opacity=1-e.t/e.life;
      if(e.t>e.life){scene.remove(e.obj);effects.splice(i,1);}
    }else if(e.type==='smash'){
      e.obj.scale.multiplyScalar(.8);e.obj.rotation.y+=dt*10;
      if(e.t>.2){scene.remove(e.obj);effects.splice(i,1);}
    }else if(e.type==='bpop'){
      e.obj.scale.setScalar(1+e.t*6);
      e.obj.traverse(o=>{if(o.material)o.material.opacity=Math.max(0,1-e.t*4);});
      if(e.t>.28){scene.remove(e.obj);effects.splice(i,1);}
    }else if(e.type==='escape'){
      e.obj.position.y+=dt*5;e.obj.scale.multiplyScalar(.93);
      if(e.t>.5){scene.remove(e.obj);effects.splice(i,1);}
    }
  }
  renderer.render(scene,camera);
}

    <div class="line"><span class="k">💥 轰掉离谱需求</span><span class="v">${R.badReq} 张</span></div>
    <div class="line"><span class="k">📋 护送合理需求进白板</span><span class="v">${R.goodSaved} 张</span></div>
    <div class="line"><span class="k">⚠️ 误伤合理需求</span><span class="v">${R.misfire} 次</span></div>
    <div class="line"><span class="k">🎯 狙爆焦虑气泡</span><span class="v">${R.bubbles} 个</span></div>
    <div class="line"><span class="k">最高连击</span><span class="v">x${R.maxCombo}</span></div>
    <div class="line"><span class="k">焦虑清除</span><span class="v">${cleared}%</span></div>
    <div class="award"><div style="font-size:11px;color:#aaa;margin-bottom:4px">今日称号</div><div class="t">「${title}」</div></div>
    <div class="eval">${evalTxt}</div>
    <div class="btns">
      <button class="copy" onclick="copyReport()">📋 复制战报</button>
      <button class="again" onclick="location.reload()">🔄 再疯一次</button>
    </div>`;
  show('scr-report');
}
function copyReport(){
  const cleared=100-Math.round(R.anxiety);
  const themeName=THEMES[R.theme]||'创业破事';
  const txt=`OPC 发疯广场今日战报\n今日破防源：${themeName}\n🔫 突突掉 Bug：${R.bugs} 个\n💥 轰掉离谱需求：${R.badReq} 张\n📋 护送合理需求：${R.goodSaved} 张\n🎯 狙爆焦虑气泡：${R.bubbles} 个\n焦虑清除：${cleared}%\n现实里不能发疯，游戏里优雅发疯。🤪`;
  if(navigator.clipboard)navigator.clipboard.writeText(txt).then(()=>toast('📋 已复制，去晒战报！'));
  else{const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('📋 已复制！');}
}

/* ================= 输入 ================= */
window.addEventListener('keydown',e=>{
  if(e.key==='1')switchWeapon('smg');
  if(e.key==='2')switchWeapon('shotgun');
  if(e.key==='3')switchWeapon('sniper');
  if(e.key===' '){e.preventDefault();firing=true;fire(0,0);}
});
window.addEventListener('keyup',e=>{if(e.key===' ')firing=false;});
window.addEventListener('pointerdown',e=>{
  if(!playing)return;
  if(e.target.closest('#weapon-bar'))return;
  const nx=(e.clientX/innerWidth)*2-1,ny=-(e.clientY/innerHeight)*2+1;
  lastPtr.x=nx;lastPtr.y=ny;
  firing=true;fire(nx,ny);
  if(crossEl){crossEl.style.left=e.clientX+'px';crossEl.style.top=e.clientY+'px';}
});
window.addEventListener('pointerup',()=>firing=false);
window.addEventListener('pointermove',e=>{
  lastPtr.x=(e.clientX/innerWidth)*2-1;lastPtr.y=-(e.clientY/innerHeight)*2+1;
  if(crossEl){crossEl.style.left=e.clientX+'px';crossEl.style.top=e.clientY+'px';}
});
window.addEventListener('contextmenu',e=>e.preventDefault());

/* ================= 启动（引擎加载失败也不黑屏） ================= */
if(window.THREE){
  initThree();animate();
}else{
  const e=document.getElementById('three-err');if(e)e.style.display='block';
}
window.addEventListener('resize',()=>{
  if(!renderer)return;
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
