<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>OPC 发疯广场 3D · 终极修正版</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { overflow: hidden; font-family: 'PingFang SC', sans-serif; background: #0f0518; color: #fff; touch-action: none; user-select: none; }
    
    /* UI */
    #ui { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
    .panel { position: absolute; background: rgba(20, 10, 30, 0.85); border: 1px solid #5a3c76; padding: 10px 15px; border-radius: 10px; backdrop-filter: blur(4px); }
    
    #hp-box { top: 20px; left: 20px; width: 220px; }
    .bar-bg { width: 100%; height: 12px; background: #333; border-radius: 6px; margin-top: 6px; overflow: hidden; border: 1px solid #555; }
    .bar-fill { height: 100%; background: linear-gradient(90deg, #ff4d4d, #ff9e9e); width: 100%; transition: width 0.2s; }
    
    #info-box { top: 20px; right: 20px; text-align: right; min-width: 120px; }
    
    #weapon-bar { bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 12px; pointer-events: auto; }
    .w-btn { 
        background: rgba(0,0,0,0.7); border: 2px solid #444; color: #aaa; 
        padding: 12px 20px; border-radius: 12px; cursor: pointer; text-align: center; transition: all 0.2s;
        min-width: 110px;
    }
    .w-btn.active { border-color: #ffcc00; color: #fff; background: rgba(255, 204, 0, 0.15); transform: translateY(-5px); box-shadow: 0 5px 20px rgba(255, 204, 0, 0.4); }
    .w-name { font-weight: bold; font-size: 16px; display: block; margin-bottom: 4px; }
    .w-desc { font-size: 12px; opacity: 0.8; }

    #msg-area { position: absolute; top: 35%; left: 50%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; }
    .float-text { font-size: 28px; font-weight: bold; text-shadow: 0 2px 4px rgba(0,0,0,0.9); animation: floatUp 1s forwards; }
    @keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-60px) scale(1.2); } }

    #crosshair { position: absolute; top: 50%; left: 50%; width: 24px; height: 24px; transform: translate(-50%, -50%); pointer-events: none; }
    #crosshair::before, #crosshair::after { content: ''; position: absolute; background: rgba(255, 255, 255, 0.9); box-shadow: 0 0 4px #000; }
    #crosshair::before { top: 11px; left: 0; width: 24px; height: 2px; }
    #crosshair::after { top: 0; left: 11px; width: 2px; height: 24px; }

    #start-screen { position: fixed; inset: 0; background: rgba(15, 5, 24, 0.98); z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: auto; }
    .start-btn { background: linear-gradient(135deg, #ff5f9e, #ff9e9e); border: none; padding: 18px 50px; font-size: 22px; color: #fff; border-radius: 30px; cursor: pointer; margin-top: 40px; box-shadow: 0 0 30px rgba(255, 95, 158, 0.6); font-weight: bold; letter-spacing: 2px; }
    .start-btn:active { transform: scale(0.95); }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui">
        <div id="hp-box" class="panel">
            <div style="font-size:14px; color:#ff9e9e; font-weight:bold;">😫 焦虑值 <span id="hp-val">100</span></div>
            <div class="bar-bg"><div class="bar-fill" id="hp-bar"></div></div>
        </div>
        
        <div id="info-box" class="panel">
            <div style="font-size:16px; font-weight:bold;">⏱ <span id="time-val">00:00</span></div>
            <div style="font-size:14px; margin-top:6px; color:#ffcc00;">🔥 连击 <span id="combo-val">0</span></div>
            <div style="font-size:12px; margin-top:6px; opacity:0.7;" id="area-name">当前：Bug 垃圾场</div>
        </div>

        <div id="crosshair"></div>
        <div id="msg-area"></div>

        <div id="weapon-bar">
            <div class="w-btn active" onclick="switchWeapon(0)">
                <span class="w-name">🔫 冲锋枪</span>
                <span class="w-desc">1. Bug 垃圾场</span>
            </div>
            <div class="w-btn" onclick="switchWeapon(1)">
                <span class="w-name">💥 霰弹枪</span>
                <span class="w-desc">2. 需求回收站</span>
            </div>
            <div class="w-btn" onclick="switchWeapon(2)">
                <span class="w-name">🎯 狙击枪</span>
                <span class="w-desc">3. 焦虑气泡池</span>
            </div>
        </div>
    </div>

    <div id="start-screen">
        <h1 style="font-size: 48px; color: #ff5f9e; text-shadow: 0 0 30px rgba(255,95,158,0.8); margin-bottom: 10px;">OPC 发疯广场 3D</h1>
        <p style="color: #c9a8ff; margin-bottom: 10px; font-size: 18px;">枪械版 · 把创业破事全部突突了</p>
        <p style="color: #888; font-size: 14px; max-width: 400px; text-align: center; line-height: 1.6;">
            相机已锁定正前方，靶子就在你眼前。<br>点击屏幕任意位置开火！
        </p>
        <button class="start-btn" onclick="startGame()">😤 进广场开火</button>
    </div>

<script>
    // --- 核心配置 ---
    const CONFIG = {
        camHeight: 1.6,      // 人眼高度
        lookAtZ: -12,        // 视线焦点：正前方12米
        lookAtY: 1.2,        // 视线高度：略低于眼睛，看靶子中心
        targetDistMin: 8,    // 靶子最近距离
        targetDistMax: 16,   // 靶子最远距离
        targetSpread: 10     // 靶子左右散布范围
    };

    let scene, camera, renderer, clock;
    let targets = [];
    let gunGroup;
    let isPlaying = false;
    let startTime = 0;
    let score = 0;
    let hp = 100;
    let currentWeapon = 0;
    
    // 音效
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;
        
        if (type === 'shoot') {
            osc.type = currentWeapon === 2 ? 'sawtooth' : 'square';
            osc.frequency.setValueAtTime(currentWeapon === 2 ? 600 : 300, now);
            osc.frequency.exponentialRampToValueAtTime(50, now + 0.15);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
            osc.start(now); osc.stop(now + 0.15);
        } else if (type === 'hit') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, now);
            osc.frequency.linearRampToValueAtTime(1200, now + 0.1);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.1);
            osc.start(now); osc.stop(now + 0.1);
        }
    }

    function init() {
        clock = new THREE.Clock();
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0f0518);
        scene.fog = new THREE.FogExp2(0x0f0518, 0.02); // 指数雾，远处自然消失

        // 相机：站在原点，高度1.6
        camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, CONFIG.camHeight, 0);
        
        // 渲染器
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // 灯光
        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 10, 5);
        scene.add(dirLight);

        // 地面网格
        const grid = new THREE.GridHelper(100, 40, 0x5a3c76, 0x2a1c36);
        grid.position.y = 0;
        scene.add(grid);
        
        const plane = new THREE.Mesh(
            new THREE.PlaneGeometry(100, 100),
            new THREE.MeshBasicMaterial({ color: 0x150a20 })
        );
        plane.rotation.x = -Math.PI / 2;
        plane.position.y = -0.02;
        scene.add(plane);

        // 创建枪械模型 (挂在相机上)
        createGun();
        camera.add(gunGroup);
        scene.add(camera); // 必须把相机加入场景，子物体才会渲染

        // 初始生成靶子
        spawnTargets();

        window.addEventListener('resize', onResize);
        window.addEventListener('mousedown', onShoot);
        window.addEventListener('touchstart', onShoot, {passive: false});
        
        animate();
    }

    function createGun() {
        gunGroup = new THREE.Group();
        
        // 枪身
        const bodyGeo = new THREE.BoxGeometry(0.15, 0.15, 0.8);
        const bodyMat = new THREE.MeshLambertMaterial({ color: 0x333333 });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.set(0, 0, 0);
        gunGroup.add(body);

        // 枪管
        const barrelGeo = new THREE.CylinderGeometry(0.04, 0.04, 0.6);
        const barrelMat = new THREE.MeshLambertMaterial({ color: 0x111111 });
        const barrel = new THREE.Mesh(barrelGeo, barrelMat);
        barrel.rotation.x = Math.PI / 2;
        barrel.position.set(0, 0.02, -0.6);
        gunGroup.add(barrel);

        // 握把
        const gripGeo = new THREE.BoxGeometry(0.12, 0.25, 0.15);
        const grip = new THREE.Mesh(gripGeo, bodyMat);
        grip.position.set(0, -0.15, 0.2);
        grip.rotation.x = -0.2;
        gunGroup.add(grip);

        // 【关键修改】把枪拿远一点，放低一点，避免挡视线
        gunGroup.position.set(0.35, -0.35, -1.2); 
        gunGroup.rotation.y = -0.1; // 稍微斜一点，更有FPS感觉
    }

    function spawnTargets() {
        // 清理旧的
        targets.forEach(t => scene.remove(t.mesh));
        targets = [];

        // 生成 5 个靶子，强制在正前方扇形区域
        for (let i = 0; i < 5; i++) {
            const size = 1.2 + Math.random() * 0.8;
            const geo = new THREE.BoxGeometry(size, size, size);
            // 随机颜色：绿/黄/蓝
            const colors = [0x4ade80, 0xfacc15, 0x60a5fa];
            const mat = new THREE.MeshLambertMaterial({ color: colors[i % 3] });
            const mesh = new THREE.Mesh(geo, mat);
            
            // 【关键修改】位置计算：
            // Z轴：负方向，8到16米之间
            const z = -(CONFIG.targetDistMin + Math.random() * (CONFIG.targetDistMax - CONFIG.targetDistMin));
            // X轴：左右散布，-5到5米
            const x = (Math.random() - 0.5) * CONFIG.targetSpread;
            // Y轴：高度在 0.8 到 2.5 米之间 (确保在视线范围内)
            const y = 0.8 + Math.random() * 1.7;
            
            mesh.position.set(x, y, z);
            mesh.userData = { rotSpeed: (Math.random() - 0.5) * 0.05 };
            
            scene.add(mesh);
            targets.push({ mesh: mesh });
        }
    }

    function onShoot(e) {
        if (!isPlaying) return;
        if (e.target.closest('.w-btn') || e.target.closest('#start-screen')) return;
        if(e.type === 'touchstart') e.preventDefault(); // 防止移动端双击缩放

        playSound('shoot');

        // 后坐力动画
        gunGroup.position.z += 0.1;
        camera.rotation.x += 0.03;
        
        // 射线检测：从屏幕正中心发射
        const raycaster = new THREE.Raycaster();
        raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
        
        const intersects = raycaster.intersectObjects(targets.map(t => t.mesh));
        
        if (intersects.length > 0) {
            const hitObj = intersects[0].object;
            handleHit(hitObj);
        } else {
            showMsg("空枪！", "#888");
        }
    }

    function handleHit(mesh) {
        playSound('hit');
        const idx = targets.findIndex(t => t.mesh === mesh);
        if (idx !== -1) {
            scene.remove(mesh);
            targets.splice(idx, 1);
            score += 10;
            document.getElementById('combo-val').innerText = score;
            showMsg("+10 焦虑消除", "#ffcc00");
            
            // 补充靶子
            if (targets.length < 3) {
                setTimeout(() => {
                    // 只生成一个补位
                    const size = 1.2 + Math.random() * 0.8;
                    const geo = new THREE.BoxGeometry(size, size, size);
                    const colors = [0x4ade80, 0xfacc15, 0x60a5fa];
                    const mat = new THREE.MeshLambertMaterial({ color: colors[Math.floor(Math.random()*3)] });
                    const m = new THREE.Mesh(geo, mat);
                    const z = -(CONFIG.targetDistMin + Math.random() * (CONFIG.targetDistMax - CONFIG.targetDistMin));
                    const x = (Math.random() - 0.5) * CONFIG.targetSpread;
                    const y = 0.8 + Math.random() * 1.7;
                    m.position.set(x, y, z);
                    m.userData = { rotSpeed: (Math.random() - 0.5) * 0.05 };
                    scene.add(m);
                    targets.push({ mesh: m });
                }, 300);
            }
        }
    }

    function showMsg(text, color) {
        const el = document.createElement('div');
        el.className = 'float-text';
        el.innerText = text;
        el.style.color = color;
        document.getElementById('msg-area').appendChild(el);
        setTimeout(() => el.remove(), 1000);
    }

    function switchWeapon(idx) {
        currentWeapon = idx;
        const btns = document.querySelectorAll('.w-btn');
        btns.forEach(b => b.classList.remove('active'));
        btns[idx].classList.add('active');
        const names = ["Bug 垃圾场", "需求回收站", "焦虑气泡池"];
        document.getElementById('area-name').innerText = "当前：" + names[idx];
        
        // 换枪重置靶子
        spawnTargets();
    }

    function startGame() {
        document.getElementById('start-screen').style.display = 'none';
        isPlaying = true;
        startTime = Date.now();
        init();
    }

    function onResize() {
        if (!camera || !renderer) return;
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
        requestAnimationFrame(animate);
        if (!isPlaying) return;

        const dt = clock.getDelta();
        const time = Date.now() * 0.001;

        // 【最关键修改】每一帧强制相机看向正前方固定点
        // 这保证了无论发生什么，你的视野中心永远是 (0, 1.2, -12)
        camera.lookAt(0, CONFIG.lookAtY, CONFIG.lookAtZ);

        // 枪械后坐力恢复
        gunGroup.position.z += (-1.2 - gunGroup.position.z) * 0.1;
        camera.rotation.x += (0 - camera.rotation.x) * 0.1;
        
        // 枪械轻微浮动
        gunGroup.position.y = -0.35 + Math.sin(time * 2) * 0.01;

        // 靶子自转
        targets.forEach(t => {
            t.mesh.rotation.y += t.mesh.userData.rotSpeed;
            t.mesh.rotation.x += t.mesh.userData.rotSpeed * 0.5;
        });

        // 更新时间
        const elapsed = Math.floor((Date.now() - startTime) / 1000);
        const m = String(Math.floor(elapsed / 60)).padStart(2, '0');
        const s = String(elapsed % 60).padStart(2, '0');
        document.getElementById('time-val').innerText = `${m}:${s}`;

        renderer.render(scene, camera);
    }
</script>
</body>
</html>
